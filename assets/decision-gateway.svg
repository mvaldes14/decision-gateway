    </filter>
  </defs>
  <rect x="8" y="8" width="144" height="144" rx="34" fill="#0F172A"/>
  <path d="M28 80h28" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
  <path d="M104 80h12c10 0 18-8 18-18V46M104 80h30M104 80h12c10 0 18 8 18 18v16" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="27" cy="80" r="11" fill="#38BDF8"/>
