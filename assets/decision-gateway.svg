<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Decision Gateway</title>
  <desc id="desc">An input passes through a decision diamond and branches to three outputs.</desc>
