name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive="decision-gateway_${VERSION#v}_${GOOS}_${GOARCH}"
          binary=decision-gateway
          if [ "$GOOS" = windows ]; then binary=decision-gateway.exe; fi
          mkdir -p "dist/$archive"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/$archive/$binary" ./cmd/decision-gateway
          cp README.md LICENSE "dist/$archive/"
          if [ "$GOOS" = windows ]; then
            (cd dist && zip -qr "$archive.zip" "$archive")
          else
            (cd dist && tar -czf "$archive.tar.gz" "$archive")
          fi
          rm -rf "dist/$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: decision-gateway-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum * > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber

  container:
    permissions:
      contents: read
      packages: write
    uses: mvaldes14/gh-actions/.github/workflows/docker-build-push.yml@main
    with:
      image: mvaldes14/decision-gateway
      platforms: linux/amd64
      tags: |
        type=semver,pattern=v{{version}}
        type=semver,pattern=v{{major}}.{{minor}}
        type=raw,value=latest
      build-args: |
        VERSION=${{ github.ref_name }}
        COMMIT=${{ github.sha }}
        BUILD_DATE=${{ github.event.head_commit.timestamp }}
