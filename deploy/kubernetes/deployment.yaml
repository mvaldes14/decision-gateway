apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-gateway
spec:
  replicas: 2
  minReadySeconds: 5
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: decision-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: decision-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: decision-gateway
          image: ghcr.io/mvaldes14/decision-gateway:latest
          env:
            - name: OTEL_SERVICE_NAME
              value: decision-gateway
            - name: DG_DEFINITIONS_DIR
              value: /etc/decision-gateway/decisions
            - name: DG_LAYA_BASE_URL
              value: http://laya:8000
            - name: DG_LAYA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: decision-gateway-providers
                  key: laya-api-key
                  optional: true
            - name: DG_CLEF_BASE_URL
              value: http://ollama:11434
            - name: DG_CLEF_MODEL
              value: clef
            - name: DG_CLEF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: decision-gateway-providers
                  key: clef-api-key
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: definitions
              mountPath: /etc/decision-gateway/decisions
              readOnly: true
      volumes:
        - name: definitions
          configMap:
            name: decision-gateway-definitions
