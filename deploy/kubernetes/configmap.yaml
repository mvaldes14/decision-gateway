apiVersion: v1
kind: ConfigMap
metadata:
  name: decision-gateway-definitions
data:
  task-triage.yaml: |
    apiVersion: decisiongateway.dev/v1alpha1
    kind: Decision
    metadata:
      name: task-triage
      version: v1
    spec:
      description: Classify engineering tasks and estimate effort
      input:
        type: object
        additionalProperties: false
        required: [title, description]
        properties:
          title: {type: string, minLength: 1, maxLength: 300}
          description: {type: string, minLength: 1, maxLength: 10000}
      decisions:
        project:
          type: choice
          instruction: Select the most appropriate owning project.
          options:
            platform: Kubernetes, networking, and shared infrastructure
            observability: Metrics, logs, traces, and telemetry pipelines
            application: Application and product functionality
        effort:
          type: choice
          instruction: Estimate relative effort using the team's story-point rubric.
          options:
            "1": Trivial, low risk
            "2": Small, well understood
            "3": Moderate, localized change
            "5": Multi-step change with uncertainty
            "8": Significant cross-component change
            "13": Large or insufficiently decomposed task
      routing:
        primary: laya
        fallback: clef
        timeout: 5s
      review:
        enabled: false
